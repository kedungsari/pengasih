<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rumah Data Kependudukan — Kalurahan Pengasih</title>
<style>
:root{
  --biru-tua:#0d3f7a;
  --biru:#1565c0;
  --biru-muda:#4a90d9;
  --emas:#c9971f;
  --emas-muda:#e8c260;
  --putih:#ffffff;
  --abu:#5b6b7d;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(74,144,217,.35), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(201,151,31,.25), transparent 50%),
    linear-gradient(160deg, #071e3d, var(--biru-tua) 55%, var(--biru) 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  background:var(--putih);
  border-radius:24px;
  padding:48px 40px 40px;
  max-width:400px;
  width:100%;
  text-align:center;
  box-shadow:0 24px 60px rgba(3,20,45,.35);
}
.logo{
  width:104px;
  height:104px;
  object-fit:contain;
  margin:0 auto 22px;
  display:block;
}
h1{
  font-size:22px;
  font-weight:800;
  color:var(--biru-tua);
  line-height:1.3;
  letter-spacing:-.01em;
}
p.sub{
  margin-top:8px;
  font-size:14px;
  color:var(--abu);
  font-weight:600;
}
.garis{
  width:44px;
  height:3px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--emas-muda),var(--emas));
  margin:20px auto 24px;
}
a.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:15px 20px;
  background:linear-gradient(135deg,var(--biru-tua),var(--biru));
  color:var(--putih);
  font-size:15px;
  font-weight:700;
  text-decoration:none;
  border-radius:13px;
  box-shadow:0 10px 24px rgba(21,101,192,.35);
  transition:transform .15s ease, box-shadow .15s ease;
}
a.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 28px rgba(21,101,192,.42);
}
a.btn:active{transform:translateY(0);}
footer{
  margin-top:28px;
  font-size:11.5px;
  color:var(--abu);
}
</style>
</head>
